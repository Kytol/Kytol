    <script>
      /* Theme + locale before paint. Do not read offset/client/scroll metrics here. */
      try {
        var root = document.documentElement;
        var locale = localStorage.getItem('zzz.locale');
        if (locale === 'fi' || locale === 'en') {
          root.lang = locale;
        }
        var theme = localStorage.getItem('zzz.theme');
        var dark = true;
        if (theme === 'light') {
          dark = false;
        } else if (theme === 'system') {
          dark =
            Boolean(window.matchMedia) && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        root.classList.toggle('ion-palette-dark', dark);
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) {
          themeMeta.setAttribute('content', dark ? '#141418' : '#f3f3f5');
        }
      } catch (e) {}
